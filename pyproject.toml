[project]
name = "ml-lab"
version = "0.0.1"
description = "A local-first ledger for the lifecycle of experimentation on frozen, time-ordered datasets."
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pyarrow>=15"]

[project.optional-dependencies]
dev = ["kaggle>=2", "pytest>=8", "ruff>=0.6", "scikit-learn>=1.5"]

[project.scripts]
lab = "ml_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ml-lab", "optiver"]
