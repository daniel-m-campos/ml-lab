name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/ruff format --check src tests examples
      - run: .venv/bin/ruff check src tests examples
      - run: .venv/bin/python -m pytest -q -p no:cacheprovider
        env:
          ML_LAB_ACTOR: ci
          OMP_NUM_THREADS: "1"
